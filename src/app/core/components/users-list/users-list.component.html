<aside class="users-sidebar">
  <div class="users-header">
    <h3>USERS</h3>
  </div>

  <div class="users-list">
    @for (user of chat.activeChannelUsers(); track user.id) {
      <div class="user" [class.online]="user.is_online" [class.offline]="!user.is_online">
        <span class="user-name">{{ user.username }}</span>
      </div>
    }
    <button class="add-btn">+ Add user</button>
  </div>
</aside>
