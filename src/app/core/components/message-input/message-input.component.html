<div class="border-top p-3 flex-shrink-0">
  <div class="d-flex gap-2 align-items-end">
    <textarea
      (keyup.enter)="sendMessage()"
      [(ngModel)]="newMessage"
      autoResize="true"
      class="w-100"
      pInputTextarea
      placeholder="Type a message..."
      rows="1"
    ></textarea>

    <button
      (click)="sendMessage()"
      [disabled]="!newMessage.trim()"
      class="p-button-secondary"
      icon="pi pi-arrow-right"
      pButton
    ></button>
  </div>
</div>
