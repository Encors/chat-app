<div class="d-flex justify-content-center align-items-center vh-100 bg-light">
  <section class="card shadow-sm w-100" style="max-width: 480px">
    <div class="card-header d-flex justify-content-between align-items-center">
      <button class="btn btn-link text-decoration-none p-0" routerLink="/">← Back</button>

      <button (click)="logout()" class="btn btn-outline-danger btn-sm">Logout</button>
    </div>

    <div class="card-body text-center">
      <h4 class="mb-4">{{ authService.user()?.username }}</h4>

      <div class="d-flex flex-column gap-3 text-start">
        <div class="d-flex justify-content-between">
          <span class="text-muted">User ID</span>
          <span class="fw-medium">{{ authService.user()?.id }}</span>
        </div>

        <div class="d-flex justify-content-between">
          <span class="text-muted">Status</span>

          <span [ngClass]="authService.user()?.is_online ? 'bg-success' : 'bg-secondary'" class="badge">
            {{ authService.user()?.is_online ? 'Online' : 'Offline' }}
          </span>
        </div>
      </div>
    </div>
  </section>
</div>
