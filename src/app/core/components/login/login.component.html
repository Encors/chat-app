<div class="login-container">
  <div class="login-card">
    <h1 class="title">Sign in</h1>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          placeholder="Enter your username"
          [class.error]="username?.invalid && username?.touched"
        />
        @if (username?.invalid && username?.touched) {
          <small class="error-message">Username is required</small>
        }
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Enter your password"
          [class.error]="password?.invalid && password?.touched"
        />
        @if (password?.invalid && password?.touched) {
          <small class="error-message">Password is required</small>
        }
      </div>

      @if (authService.error(); as error) {
        <div class="alert alert-error">
          {{ error }}
        </div>
      }

      <button type="submit" [disabled]="loginForm.invalid || authService.loading()" class="btn-primary">
        @if (authService.loading()) {
          <span class="spinner"></span>
        }
        {{ authService.loading() ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <div class="demo-credentials">
      <p>Demo credentials:</p>
      <p>Username: <strong>Anton</strong> | Password: <strong>password123</strong></p>
    </div>
  </div>
</div>
