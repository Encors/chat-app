<aside class="channels-sidebar">
  <section>
    <div class="section-header">
      <h3>CHANNELS</h3>
    </div>

    <div class="channels-list">
      @for (channel of chat.userChannels(); track channel.id) {
        <button class="channel-item" (click)="selectChannel(channel.id)">
          <span>#{{ channel.name }}</span>
        </button>
      }
      <button class="add-btn">+ Add channel</button>
    </div>
  </section>
</aside>
